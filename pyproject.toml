[project]
name = "wac510-mcp"
version = "0.1.0"
description = "FastMCP server for a NETGEAR WAC510 access point"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "skyline69" }]
keywords = ["mcp", "fastmcp", "netgear", "wac510", "wifi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cryptography==50.0.1",
    "fastmcp==4.0.3",
    "httpx==0.28.1",
    "platformdirs==4.11.8",
    "rich==15.0.0",
]

[project.urls]
Homepage = "https://github.com/skyline69/wac510-mcp"
Repository = "https://github.com/skyline69/wac510-mcp.git"
Issues = "https://github.com/skyline69/wac510-mcp/issues"

[project.scripts]
wac510-mcp = "wac510_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
