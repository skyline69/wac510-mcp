[project]
name = "wac510-mcp"
version = "0.1.0"
description = "FastMCP server for a NETGEAR WAC510 access point"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.0.3",
    "httpx==0.28.1",
]

[project.scripts]
wac510-mcp = "wac510_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true

