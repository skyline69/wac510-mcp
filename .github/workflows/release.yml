name: Publish release

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ github.sha }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pypi.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.14.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run strict type checks
        run: uv run mypy src tests

      - name: Read package version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is new
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/wac510-mcp/${VERSION}/json")"
          case "$status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "wac510-mcp ${VERSION} already exists on PyPI; publication will be skipped."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "wac510-mcp ${VERSION} is available for publication."
              ;;
            *)
              echo "Unexpected PyPI response: HTTP ${status}" >&2
              exit 1
              ;;
          esac

  build:
    name: Build distributions
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.14.7"
          enable-cache: false

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl --
          python -c "from importlib.metadata import version; import wac510_mcp; assert version('wac510-mcp') == '${{ needs.verify.outputs.version }}'"

      - name: Smoke-test source distribution
        run: >-
          uv run --isolated --no-project --with dist/*.tar.gz --
          python -c "from importlib.metadata import version; import wac510_mcp; assert version('wac510-mcp') == '${{ needs.verify.outputs.version }}'"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.verify.outputs.version }} to PyPI
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wac510-mcp/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Generate PyPI attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish with trusted authentication
        run: uv publish --trusted-publishing always

